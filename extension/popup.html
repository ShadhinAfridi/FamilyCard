<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>NID Auto-Filler Settings</title>
  <style>
    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      color: #1e293b;
      background: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #1c3b68;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 11px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12.5px;
      box-sizing: border-box;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: #1976d2;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover {
      background: #1565c0;
    }
    .footer-note {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
    }
    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      background: #dcfce7;
      color: #166534;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 12px;
      font-weight: bold;
      color: #1e3a8a;
      margin: 10px 0 6px 0;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 2px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .cost-card {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11px;
      color: #166534;
      line-height: 1.45;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h3>🪪 NID Auto-Filler</h3>
  <div class="status-tag">সক্রিয় (Active • v1.9)</div>

  <div class="section-title">📱 AI মডেল, ডিফল্ট কী ও খরচ</div>
  <div class="field">
    <label for="aiProvider">🧠 AI কৌশল (Strategy):</label>
    <select id="aiProvider">
      <option value="economy" selected>💸 সাশ্রয়ী অটো (3.5 Lite → অস্পষ্ট হলে 3.8)</option>
      <option value="deepseek">🐋 DeepSeek Flash (~$0.38/1K Off-Peak)</option>
      <option value="gemini_lite">⚡ Gemini Flash-Lite (~$0.78–$1.11/1K)</option>
      <option value="auto">⚖️ ডুয়াল-AI (ডিফল্ট কী → ব্যাকআপ ফলব্যাক)</option>
      <option value="gemini">💎 Gemini শুধুমাত্র (নির্বাচিত মডেল আগে)</option>
    </select>
  </div>
  <div class="field">
    <label for="defaultKeySlot">🔑 ডিফল্ট প্রাথমিক API Key (দুটো কী থাকলে):</label>
    <select id="defaultKeySlot">
      <option value="auto" selected>🤖 কৌশল অনুযায়ী স্বয়ংক্রিয়</option>
      <option value="gemini">✨ Gemini Key আগে ব্যবহার করো</option>
      <option value="deepseek">🐋 DeepSeek Key আগে ব্যবহার করো</option>
    </select>
  </div>
  <div class="row-2">
    <div class="field">
      <label for="geminiModel">Gemini মডেল:</label>
      <select id="geminiModel">
        <option value="gemini-3.5-flash-lite" selected>3.5 Lite ($0.30/$2.50)</option>
        <option value="gemini-3.8-flash">3.8 Flash ($0.75/$3.75)</option>
        <option value="gemini-4-argon">4 Argon ($2.00/$10.00)</option>
        <option value="gemini-3.1-flash-lite">3.1 Lite ($0.25/$1.50)</option>
      </select>
    </div>
    <div class="field">
      <label for="deepseekModel">DeepSeek মডেল:</label>
      <select id="deepseekModel">
        <option value="deepseek-flash" selected>deepseek-flash ($0.15/$0.60)</option>
      </select>
    </div>
  </div>
  <div id="popupCostCard" class="cost-card">হিসাব লোড হচ্ছে...</div>
  <div class="field">
    <label for="geminiApiKey">Gemini API Key:</label>
    <input type="password" id="geminiApiKey" placeholder="AIzaSy...">
  </div>
  <div class="field">
    <label for="deepseekApiKey">DeepSeek API Key (ঐচ্ছিক / ব্যাকআপ):</label>
    <input type="password" id="deepseekApiKey" placeholder="sk-...">
  </div>

  <div class="section-title">🔄 Cross-Device ও রুম মেসেজিং</div>
  <div class="field">
    <label for="serverUrl">রিলে সার্ভার URL (ঐচ্ছিক, ছাড়াও ক্লাউডে চলে):</label>
    <input type="text" id="serverUrl" value="http://localhost:3000">
  </div>
  <div class="row-2">
    <div class="field">
      <label for="roomCode">রুম / পেয়ার কোড:</label>
      <input type="text" id="roomCode" value="FC-101">
    </div>
    <div class="field">
      <label for="deviceName">আমার ডিভাইস নাম:</label>
      <input type="text" id="deviceName" value="পিসি-এক্সটেনশন" placeholder="পিসি / ট্যাব">
    </div>
  </div>
  <div style="display:flex; gap:6px; margin-bottom:10px;">
    <button id="btnCopyRoomLink" type="button" class="btn" style="background:#0f766e; font-size:11.5px; padding:7px;">🔗 রুম লিংক কপি (ফোনে খুলুন)</button>
  </div>

  <button id="btnSave" class="btn">সেটিংস সংরক্ষণ করুন</button>

  <div class="footer-note">
    💡 <b>ট্যাবলেটে সরাসরি স্ক্যান:</b> স্ক্রিনে <b>"📸 NID স্ক্যান"</b> বাটনে চাপ দিলে ট্যাবলেটের ক্যামেরা দিয়ে সরাসরি ছবি তুলে এই ফর্মেই পূরণ হবে!
  </div>

  <script src="popup.js"></script>
</body>
</html>
